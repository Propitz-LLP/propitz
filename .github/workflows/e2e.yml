name: E2E Smoke Tests

# Runs on every merge/push to master, on every PR targeting master (pre-merge
# gate — the screenshot-proof email doubles as the PR check), and on demand.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Cancel an in-flight run when a newer commit lands on the same ref (a PR's head
# branch, or master). github.ref is unique per PR, so PRs don't cancel master.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: 'true'
      # ── App / Supabase (test project — set these in repo Settings → Secrets) ──
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TEST_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.TEST_SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}
      # ── Email (proof-of-run report) ──
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      TEST_REPORT_TO: ${{ secrets.TEST_REPORT_TO }}
      # ── Seeded test accounts ──
      TEST_INVESTOR_EMAIL: ${{ secrets.TEST_INVESTOR_EMAIL }}
      TEST_INVESTOR_PASSWORD: ${{ secrets.TEST_INVESTOR_PASSWORD }}
      TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
      TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Seed test accounts
        run: npm run test:seed

      # Run the suite but don't fail the job yet — we still want the email to send.
      # Capture the exit code and enforce it after reporting.
      - name: Run E2E tests
        id: e2e
        run: npm run test:e2e
        continue-on-error: true

      - name: Email test report
        if: always()
        run: npm run test:report

      # Full browsable HTML report, downloadable from the run's Artifacts.
      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Full-resolution screenshot proof (also embedded inline in the email).
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # Now surface the real test outcome so a broken master shows red.
      - name: Enforce test result
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "E2E suite failed — see the emailed report and the uploaded artifact."
          exit 1
